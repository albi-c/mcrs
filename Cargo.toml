[package]
name = "mcrs"
version = "0.1.0"
edition = "2024"

[workspace]
resolver = "3"
members = ["gpu"]

[workspace.dependencies]
bytemuck = "1.24.0"
vulkanalia = "0.34.0"
anyhow = "1.0.100"
log = "0.4.29"
pretty_env_logger = "0.5.0"
glam = { version = "0.30.9", features = ["bytemuck"] }

[features]
#default = ["wayland"]
#wayland = ["winit/wayland", "winit/wayland-dlopen", "winit/wayland-csd-adwaita"]

[dependencies]
gpu = { path = "gpu" }
winit = { version = "0.29.15", default-features = false, features = ["rwh_06", "x11"] }
anyhow = { workspace = true }
vulkanalia = { workspace = true, features = ["libloading", "window"] }
log = { workspace = true }
pretty_env_logger = { workspace = true }
glam = { workspace = true }
bytemuck = { workspace = true }
image = "0.25.9"
lz4 = "1.28.1"
gltf = { version = "1.4.1", features = ["utils"] }
itertools = "0.14.0"
half = { version = "2.7.1", features = ["bytemuck"] }
meshopt = "0.6.2"
shaderc = { version = "0.10.1", features = ["build-from-source"] }
