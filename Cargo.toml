[package]
name = "mcrs"
version = "0.1.0"
edition = "2024"

[workspace]
resolver = "3"
members = ["gpu"]

[workspace.dependencies]
bytemuck = "1.24.0"
bytemuck_derive = "1.10.2"
vulkanalia = "0.34.0"
anyhow = "1.0.100"
log = "0.4.29"
pretty_env_logger = "0.5.0"
glam = { version = "0.30.9", features = ["bytemuck"] }

[dependencies]
gpu = { path = "gpu" }
winit = { version = "0.29.15" }
anyhow = { workspace = true }
vulkanalia = { workspace = true, features = ["libloading", "window"] }
log = { workspace = true }
pretty_env_logger = { workspace = true }
glam = { workspace = true }
bytemuck = { workspace = true }
image = "0.25.9"
lz4 = "1.28.1"
tobj = "4.0.3"
mesh-loader = "0.1.13"
gltf = { version = "1.4.1", features = ["names"] }
