[package]
name = "mcrs"
version = "0.1.0"
edition = "2024"

[workspace]
resolver = "3"
members = ["gpu"]

[workspace.dependencies]
bytemuck = "1.24.0"
vulkanalia = "0.34.0"
anyhow = "1.0.100"
log = "0.4.29"
pretty_env_logger = "0.5.0"

[dependencies]
gpu = { path = "gpu" }
winit = { version = "0.29.15" }
anyhow = { workspace = true }
vulkanalia = { workspace = true, features = ["libloading", "window"] }
log = { workspace = true }
pretty_env_logger = { workspace = true }
