[package]
name = "mcrs"
version = "0.1.0"
edition = "2024"

[workspace]
resolver = "3"
members = ["gpu", "macros"]

[workspace.dependencies]
bytemuck = "1.25.2"
vulkanalia = "0.34.0"
ash = { version = "0.38.0", features = ["libloading"] }
anyhow = "1.0.100"
log = "0.4.29"
pretty_env_logger = "0.5.0"
glam = { version = "0.33.5", features = ["bytemuck", "serde"] }
bitflags = "2.10.0"
smallvec = { version = "1.15.2", features = ["serde"] }

[features]
#default = ["wayland"]
#wayland = ["winit/wayland", "winit/wayland-dlopen", "winit/wayland-csd-adwaita"]

[dependencies]
gpu = { path = "gpu" }
macros = { path = "macros" }
winit = { version = "0.29.15", default-features = false, features = ["rwh_06", "x11"] }
anyhow = { workspace = true }
vulkanalia = { workspace = true, features = ["libloading", "window"] }
log = { workspace = true }
pretty_env_logger = { workspace = true }
glam = { workspace = true }
bytemuck = { workspace = true, version = "1.0.0", features = ["const_zeroed"] }
bitflags = { workspace = true }
image = "0.25.9"
lz4_flex = "0.14.0"
gltf = { version = "1.4.1", features = ["utils"] }
itertools = "0.14.0"
half = { version = "2.7.1", features = ["bytemuck"] }
meshopt = "0.6.2"
shaderc = { version = "0.10.1", features = ["build-from-source", "prefer-static-linking"] }
dear-imgui-rs = "0.17.0"
dear-imguizmo = "0.17.0"
dear-imnodes = "0.17.0"
dear-node-editor = "0.17.0"
dear-imgui-winit = "0.17.0"
dear-imgui-ash = { version = "0.17.0", features = ["dynamic-rendering"] }
ash = { workspace = true }
serde = { version = "1.0.229", features = ["derive"] }
postcard = "1.1.3"
serde_json = "1.0.151"
smol_str = { version = "0.3.6", features = ["serde"] }
smallvec = { workspace = true }
lazy_static = "1.5.0"
rand = "0.10.2"
bevy_ecs = "0.19.1"
noise = "0.9.0"
#boxddd = { version = "0.4.0", features = ["glam", "serde"] }
